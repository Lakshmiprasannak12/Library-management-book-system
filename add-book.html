<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book - Library Management</title>
    <link rel="stylesheet" href="add-book.css">
</head>
<body>
    <div class="container">
        <h1>📚 Add New Book</h1>
        <form id="addBookForm">
            <label for="bookTitle">Book Title</label>
            <input type="text"id="bookTitle"placeholder="Enter book title">
            <label for="bookAuthor">Author</label>
            <input type="text"id="bookAuthor"placeholder="Enter author name">
            <label for="bookCategory">Category</label>
            <input type="text"id="bookCategory"placeholder="Enter book category">
            <button type="submit" id="addBookBtn">
                ADD BOOK
            </button>
            <p id="message"></p>
        </form>
        <button class="back-btn" onclick="window.location.href='dashboard.html'">
             Back to Dashboard
        </button>
    </div>
    <script src="add-book.js"></script>

</body>

</html>
