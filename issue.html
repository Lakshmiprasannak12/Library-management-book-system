<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Books - Library Management</title>
    <link rel="stylesheet" href="issue.css">
</head>
<body>
    <div class="issue-container">
        <h1>📖 Issue Books</h1>
        <form id="issueBookForm">
            <label for="issueBookName">
                Book Name
            </label>
            <input type="text"id="issueBookName"readonly>
            <label for="studentName">Student Name</label>
            <input type="text"id="studentName"placeholder="Enter student name">
            <label for="studentId">Student ID</label>
            <input type="text"id="studentId"placeholder="Enter student ID">
            <label for="issueDate">Issue Date</label>
            <input type="date"id="issueDate">
            <button type="submit"id="confirmIssueBtn">
                CONFIRM ISSUE
            </button>
            <p id="message"></p>
        </form>
        <button
            class="back-btn"
            onclick="window.location.href='book list.html'">
            Back to Book List
        </button>
        <button
            class="dashboard-btn"
            onclick="window.location.href='dashboard.html'">
            Back to Dashboard
        </button>
    </div>
    <script src="issue.js"></script>

</body>

</html>
