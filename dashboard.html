<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <h2>📚 Library</h2>
            <p class="librarian">Librarian</p>
            <nav>
                <button id="dashboardBtn"> Dashboard</button>
                <button id="addBookBtn">Add Book</button>
                <button id="bookListBtn">Book List</button>
                <button id="issueBooksBtn">Issue Books</button>
                 <button id="returnBooksBtn">Return Books</button>
                <button id="logoutBtn">Logout</button>
            </nav>
        </div>
        <div class="content">
            <div class="bar">
                <div>
                    <h1>Library Dashboard</h1>
                    <p>Welcome, Librarian!</p>
                </div>
            </div>
            <div class="cards">
                <div class="card">
                    <h3>Total Books</h3>
                    <p id="totalBooks">0</p>
                </div>
                <div class="card">
                    <h3> Available Books</h3>
                    <p id="availableBooks">0</p>
                </div>
                <div class="card">
                    <h3> Issued Books</h3>
                    <p id="issuedBooks">0</p>
                </div>
            </div>
            <div class="box">
                <h2>Welcome to Library Management System</h2>
                <p>
                    Manage books, issue books, return books,
                    and search library records easily.
                </p>
            </div>
        </div>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
